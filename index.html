
<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catálogo de Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body { 
        font-family: 'Inter', sans-serif;
        background-color: #000;
      }
      .card-img-top-container {
        aspect-ratio: 1 / 1;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .card-img-top {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      #whatsapp-fab {
        position: fixed;
        width: 60px;
        height: 60px;
        bottom: 25px;
        right: 25px;
        background-color: #25D366;
        color: #FFF;
        border-radius: 50px;
        text-align: center;
        font-size: 30px;
        box-shadow: 2px 2px 6px rgba(0,0,0,0.25);
        z-index: 1000;
        transition: transform 0.2s ease;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #whatsapp-fab:hover {
        transform: scale(1.05);
      }
      #whatsapp-fab svg {
        width: 32px;
        height: 32px;
      }
      .form-control, .form-select {
        background-color: #101010;
        border-color: #444;
        color: #D9D9D9;
      }
      .form-control:focus, .form-select:focus {
        background-color: #101010;
        border-color: #FFD300;
        color: #D9D9D9;
        box-shadow: 0 0 0 0.25rem rgba(255, 211, 0, 0.25);
      }
    </style>
</head>
<body class="bg-black">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top border-bottom border-secondary py-3">
        <div class="container-fluid">
            <div id="header-brand-container" class="navbar-brand d-flex align-items-center gap-2" href="#">
                <span class="fs-4 fw-bold" style="color: #FFD300;">Catálogo</span>
            </div>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarFilters" aria-controls="navbarFilters" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarFilters">
                 <div id="filters" class="d-flex flex-wrap align-items-center gap-2 w-100 justify-content-center pt-3 pt-lg-0">
                    <input type="text" id="search-input" placeholder="Buscar productos..." class="form-control form-control-sm flex-grow-1 flex-sm-grow-0" style="min-width: 150px; max-width: 250px;">
                    <select id="category-select" class="form-select form-select-sm flex-grow-1 flex-sm-grow-0" style="min-width: 150px; max-width: 250px;"></select>
                    <select id="brand-select" class="form-select form-select-sm flex-grow-1 flex-sm-grow-0" style="min-width: 150px; max-width: 250px;"></select>
                    <select id="measure-select" class="form-select form-select-sm flex-grow-1 flex-sm-grow-0" style="min-width: 150px; max-width: 250px;"></select>
                    <button id="clear-filters-btn" class="btn btn-sm btn-outline-secondary" title="Borrar filtros" style="display: none;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-x-lg" viewBox="0 0 16 16">
                          <path d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="container-fluid p-3 p-md-4">
        <div id="product-grid" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 row-cols-xl-5 g-4">
            <!-- Los productos se cargarán aquí -->
        </div>
    </main>

    <a href="https://wa.me/5491134317611" target="_blank" rel="noopener noreferrer" id="whatsapp-fab" title="Chatea con nosotros en WhatsApp">
        <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M16.75 13.96c.25.13.43.2.5.25a.48.48 0 0 1 .2.37c-.03.25-.2.58-.3.72s-.27.28-.5.33a1.49 1.49 0 0 1-.64.06c-.23 0-.48-.06-.82-.24s-1.12-.64-2-1.46c-.72-.67-1.2-1.34-1.5-1.85-.3-.5-.6-1.07-.6-1.61 0-.5.23-.94.63-1.28.18-.15.38-.2.55-.2.17 0 .33.02.48.04s.28.05.38.35c.1.3.18.6.22.8a.78.78 0 0 1-.06.68c-.04.1-.1.18-.18.28s-.15.17-.2.22c-.06.05-.1.1-.12.14a.8.8 0 0 0-.03.3c.02.08.05.15.1.22s.1.13.18.2a4.3 4.3 0 0 0 .58.55c.23.2.42.34.58.46zM12 2a10 10 0 0 0-10 10 10 10 0 0 0 10 10c.04 0 .08.02.12.02h.12c.03 0 .07 0 .1 0a9.89 9.89 0 0 0 5.12-1.48l3.35 1-1-3.37a9.86 9.86 0 0 0 1.45-5.22A10 10 0 0 0 12 2z"/></svg>
    </a>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const productGrid = document.getElementById('product-grid');
        const headerBrandContainer = document.getElementById('header-brand-container');
        const searchInput = document.getElementById('search-input');
        const categorySelect = document.getElementById('category-select');
        const brandSelect = document.getElementById('brand-select');
        const measureSelect = document.getElementById('measure-select');
        const clearFiltersBtn = document.getElementById('clear-filters-btn');
        
        let allProducts = [];

        const formatCurrency = (value) => {
          if (!value || String(value).trim() === '') return 'Consultar';
          if (/[a-zA-Z]/.test(String(value))) return value;
          const standardizedValue = String(value).replace(/\./g, '').replace(',', '.');
          const number = parseFloat(standardizedValue);
          if (isNaN(number)) return value;
          return new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS' }).format(number);
        };

        const createProductCardHTML = (product) => {
          const details = [product.medida, product.origen].filter(Boolean).join(' - ');
          
          return `
            <div class="col">
                <div class="card h-100 bg-dark text-light border-secondary shadow-sm">
                    <div class="card-img-top-container bg-white">
                        <img src="${product.imageUrl}" alt="${product.name}" class="card-img-top" />
                    </div>
                    <div class="card-body d-flex flex-column">
                        ${product.brand ? `<p class="text-muted text-uppercase small fw-semibold">${product.brand}</p>` : ''}
                        <p class="small text-warning">${product.category}</p>
                        <h5 class="card-title fw-bold mt-1">${product.name}</h5>
                        ${details ? `<p class="small text-muted mt-1">${details}</p>` : ''}
                        
                        <div class="mt-auto pt-3">
                          ${product.cashPrice ? `
                              <div>
                                  <p class="text-muted text-decoration-line-through mb-0">${formatCurrency(product.listPrice)}</p>
                                  <p class="h3 fw-bolder text-warning">${formatCurrency(product.cashPrice)}</p>
                                  <p class="small text-muted">Precio Contado</p>
                              </div>
                          ` : `
                              <div>
                                  <p class="h3 fw-bolder text-warning">${formatCurrency(product.listPrice)}</p>
                                  <p class="small text-muted">Precio de Lista</p>
                              </div>
                          `}
                        </div>
                        
                        <div class="mt-3 flex-grow-1 d-flex align-items-center" style="min-height: 80px;">
                            ${product.description ? `<p class="card-text small text-justify">${product.description}</p>` : ''}
                        </div>
                    </div>
                     <div class="card-footer bg-black text-white-50 small text-center">
                        <p class="mb-1 fw-semibold">Lagartobike - Av. Juan de Garay 612 - San Telmo - CABA</p>
                        <div class="d-flex align-items-center justify-content-center flex-wrap gap-3 mt-2">
                            <div class="d-flex align-items-center gap-1">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-instagram" viewBox="0 0 16 16"><path d="M8 0C5.829 0 5.556.01 4.703.048 3.85.088 3.269.222 2.76.42a3.9 3.9 0 0 0-1.417.923A3.9 3.9 0 0 0 .42 2.76C.222 3.268.087 3.85.048 4.7.01 5.555 0 5.827 0 8s.01 2.444.048 3.297c.04.852.174 1.433.372 1.942.205.526.478.972.923 1.417.444.445.89.719 1.416.923.51.198 1.09.333 1.942.372C5.555 15.99 5.827 16 8 16s2.444-.01 3.298-.048c.851-.04 1.434-.174 1.943-.372a3.9 3.9 0 0 0 1.416-.923c.445-.445.718-.891.923-1.417.197-.509.332-1.09.372-1.942C15.99 10.445 16 10.173 16 8s-.01-2.445-.048-3.299c-.04-.851-.175-1.433-.372-1.941a3.9 3.9 0 0 0-.923-1.417A3.9 3.9 0 0 0 13.24.42c-.51-.198-1.092-.333-1.943-.372C10.443.01 10.172 0 8 0zm0 1.442c2.136 0 2.389.007 3.232.046.78.035 1.204.166 1.486.275.373.145.64.319.92.599s.453.546.598.92c.11.281.24.705.275 1.485.039.843.047 1.096.047 3.231s-.008 2.389-.047 3.232c-.035.78-.166 1.203-.275 1.485a2.5 2.5 0 0 1-.598.92c-.28.28-.546.453-.92.598-.28.11-.704.24-1.485.276-.843.038-1.096.047-3.232.047s-2.39-.009-3.233-.047c-.78-.036-1.203-.166-1.485-.276a2.5 2.5 0 0 1-.92-.598 2.5 2.5 0 0 1-.598-.92c-.11-.28-.24-.705-.275-1.485-.038-.843-.046-1.096-.046-3.231s.008-2.389.046-3.232c.036-.78.166-1.204.276-1.486.145-.373.319-.64.599-.92s.546-.453.92-.598c.282-.11.705-.24 1.485-.276.843-.038 1.096-.047 3.232-.047zM8 4.865a3.135 3.135 0 1 0 0 6.27 3.135 3.135 0 0 0 0-6.27zM8 10a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm4.885-6.402a.96.96 0 1 0 0 1.92.96.96 0 0 0 0-1.92z"/></svg>
                                <span>lagarto.bike</span>
                            </div>
                            <div class="d-flex align-items-center gap-1">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-facebook" viewBox="0 0 16 16"><path d="M16 8.049c0-4.446-3.582-8.05-8-8.05S0 3.603 0 8.049c0 4.017 2.926 7.347 6.75 7.951v-5.625h-2.03V8.05h2.03v-2.117c0-2.018 1.195-3.131 3.022-3.131.876 0 1.791.157 1.791.157v1.98h-1.009c-.993 0-1.303.621-1.303 1.258v1.51h2.218l-.354 2.326H9.25V16c3.824-.604 6.75-3.934 6.75-7.951z"/></svg>
                                <span>Lagartobike</span>
                            </div>
                            <div class="d-flex align-items-center gap-1">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-telephone-fill" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M1.885.511a1.745 1.745 0 0 1 2.61.163L6.29 2.98c.329.423.445.974.246 1.405l-1.11 2.061c.11.22.25.433.42.62a13.3 13.3 0 0 0 6.564 6.564c.187.17.399.31.62.42l2.061-1.11a1.44 1.44 0 0 1 1.405.246l2.311 1.734c.45.337.644.945.42 1.488l-.94 1.879a1.75 1.75 0 0 1-2.909.833A17.1 17.1 0 0 1 .51 1.885.75.75 0 0 1 .672.887l.213-.128a1.75 1.75 0 0 1 1.002-.248z"/></svg>
                                <span>Sebastian 11-3431-7611</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
          `;
        };
        
        const renderProducts = (productsToRender) => {
            if (productsToRender.length === 0) {
                productGrid.innerHTML = `<div class="text-center col-12 py-5"><p class="fs-4 text-muted">No se encontraron productos que coincidan con los filtros.</p></div>`;
                return;
            }
            let productsHTML = '';
            productsToRender.forEach(product => {
                productsHTML += createProductCardHTML(product);
            });
            productGrid.innerHTML = productsHTML;
        };

        const applyFilters = () => {
            const searchTerm = searchInput.value.toLowerCase();
            const selectedCategory = categorySelect.value;
            const selectedBrand = brandSelect.value;
            const selectedMeasure = measureSelect.value;

            const filtered = allProducts.filter(p => {
                const matchesSearch = p.name.toLowerCase().includes(searchTerm);
                const matchesCategory = selectedCategory === 'all' || p.category === selectedCategory;
                const matchesBrand = selectedBrand === 'all' || p.brand === selectedBrand;
                const matchesMeasure = selectedMeasure === 'all' || p.medida === selectedMeasure;
                return matchesSearch && matchesCategory && matchesBrand && matchesMeasure;
            });

            const sorted = [...filtered].sort((a, b) => {
                const categoryComparison = a.category.localeCompare(b.category, 'es', { sensitivity: 'base' });
                if (categoryComparison !== 0) return categoryComparison;
                const brandA = a.brand || '';
                const brandB = b.brand || '';
                const brandComparison = brandA.localeCompare(brandB, 'es', { sensitivity: 'base' });
                if (brandComparison !== 0) return brandComparison;
                const measureA = a.medida || '';
                const measureB = b.medida || '';
                return measureA.localeCompare(measureB, 'es', { sensitivity: 'base' });
            });

            renderProducts(sorted);

            const isFilterActive = searchTerm || selectedCategory !== 'all' || selectedBrand !== 'all' || selectedMeasure !== 'all';
            clearFiltersBtn.style.display = isFilterActive ? 'inline-block' : 'none';
        };

        const populateSelect = (selectElement, items, defaultOptionText) => {
            selectElement.innerHTML = `<option value="all">${defaultOptionText}</option>`;
            const uniqueItems = [...new Set(items.filter(Boolean))];
            uniqueItems.sort((a, b) => a.localeCompare(b, 'es', { sensitivity: 'base' }));
            uniqueItems.forEach(item => {
                const option = document.createElement('option');
                option.value = item;
                option.textContent = item;
                selectElement.appendChild(option);
            });
            selectElement.style.display = uniqueItems.length > 0 ? 'block' : 'none';
        };
        
        const renderCatalog = (data) => {
          allProducts = data.products || [];

          if (data.logoUrl) {
              const logoImg = document.createElement('img');
              logoImg.src = data.logoUrl;
              logoImg.alt = 'Logo';
              logoImg.className = 'rounded-circle';
              logoImg.style.width = '40px';
              logoImg.style.height = '40px';
              logoImg.style.objectFit = 'cover';
              headerBrandContainer.prepend(logoImg);
          }
          
          populateSelect(categorySelect, allProducts.map(p => p.category), 'Todas las familias');
          populateSelect(brandSelect, allProducts.map(p => p.brand), 'Todas las marcas');
          populateSelect(measureSelect, allProducts.map(p => p.medida), 'Todas las medidas');
        
          applyFilters();

          searchInput.addEventListener('input', applyFilters);
          categorySelect.addEventListener('change', applyFilters);
          brandSelect.addEventListener('change', applyFilters);
          measureSelect.addEventListener('change', applyFilters);
          
          clearFiltersBtn.addEventListener('click', () => {
              searchInput.value = '';
              categorySelect.value = 'all';
              brandSelect.value = 'all';
              measureSelect.value = 'all';
              applyFilters();
          });
        };

        
        fetch('data.json')
            .then(response => response.json())
            .then(data => renderCatalog(data))
            .catch(error => {
                console.error('Error al cargar los datos de los productos:', error);
                document.getElementById('product-grid').innerHTML = '<p class="text-center col-12 text-danger">No se pudo cargar el catálogo.</p>';
            });
      
      });
    </script>
</body>
</html>
