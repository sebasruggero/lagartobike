
<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Catálogo de Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body { 
        font-family: 'Inter', sans-serif;
        background-color: #000;
        overflow-x: hidden;
      }
      .navbar-logo {
        height: 50px;
        width: auto;
        object-fit: contain;
      }
      .card-img-top-container {
        aspect-ratio: 1 / 1;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }
      .card-img-top {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }
      #whatsapp-fab {
        position: fixed;
        width: 60px;
        height: 60px;
        bottom: 25px;
        right: 25px;
        background-color: #25D366;
        color: #FFF;
        border-radius: 50px;
        text-align: center;
        font-size: 30px;
        box-shadow: 2px 2px 6px rgba(0,0,0,0.25);
        z-index: 1000;
        transition: transform 0.2s ease, width 0.2s ease, height 0.2s ease;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #whatsapp-fab:hover {
        transform: scale(1.05);
      }
      #whatsapp-fab svg {
        width: 32px;
        height: 32px;
        transition: width 0.2s ease, height 0.2s ease;
      }
      .form-control, .form-select, .dropdown-menu {
        background-color: #101010;
        border-color: #444;
        color: #D9D9D9;
      }
      .form-control:focus, .form-select:focus {
        background-color: #101010;
        border-color: #FFD300;
        color: #D9D9D9;
        box-shadow: 0 0 0 0.25rem rgba(255, 211, 0, 0.25);
      }
       .dropdown-item {
         color: #D9D9D9;
       }
      .dropdown-item:hover, .dropdown-item:focus {
        background-color: #FFD300;
        color: #101010;
      }
      .navbar-brand .fs-4 {
          font-size: 1.25rem !important;
      }
      
      /* Responsive styles */
      @media (max-width: 991.98px) {
        .navbar-nav {
          padding-top: 1rem;
        }
      }
      
      @media (max-width: 767.98px) {
        .card-title {
          font-size: 1.1rem;
        }
        .card-body .h3 {
          font-size: 1.5rem;
        }
        .card-footer .d-flex {
            font-size: 0.7rem;
        }
        #whatsapp-fab {
            width: 50px;
            height: 50px;
            bottom: 20px;
            right: 20px;
        }
        #whatsapp-fab svg {
            width: 28px;
            height: 28px;
        }
        .navbar-brand .fs-4 {
          font-size: 1.1rem !important;
        }
      }

      @media (max-width: 575.98px) {
        .navbar-logo {
          height: 40px;
        }
        .card-footer .d-flex {
            flex-direction: column;
            align-items: center;
            gap: 0.5rem !important;
        }
      }
    </style>
</head>
<body class="bg-black">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top border-bottom border-secondary py-3">
        <div class="container-fluid">
            <a class="navbar-brand d-flex align-items-center gap-3" href="#" id="navbar-brand-container">
                <span class="fs-4 fw-bold" style="color: #FFD300;">Catálogo</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="category-dropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false" data-value="all">Familia</a>
                        <ul class="dropdown-menu" aria-labelledby="category-dropdown" id="category-dropdown-menu"></ul>
                    </li>
                    <li class="nav-item dropdown" id="brand-dropdown-container" style="display: none;">
                        <a class="nav-link dropdown-toggle" href="#" id="brand-dropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false" data-value="all">Marcas</a>
                        <ul class="dropdown-menu" aria-labelledby="brand-dropdown" id="brand-dropdown-menu"></ul>
                    </li>
                    <li class="nav-item dropdown" id="measure-dropdown-container" style="display: none;">
                        <a class="nav-link dropdown-toggle" href="#" id="measure-dropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false" data-value="all">Medida</a>
                        <ul class="dropdown-menu" aria-labelledby="measure-dropdown" id="measure-dropdown-menu"></ul>
                    </li>
                </ul>
                <div class="d-flex gap-2 align-items-center">
                    <input class="form-control" type="search" placeholder="Buscar" aria-label="Buscar" id="search-input">
                    <button id="clear-filters-btn" class="btn btn-sm btn-outline-secondary" title="Borrar filtros" style="display: none;">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-x-lg" viewBox="0 0 16 16">
                            <path d="M2.146 2.854a.5.5 0 1 1 .708-.708L8 7.293l5.146-5.147a.5.5 0 0 1 .708.708L8.707 8l5.147 5.146a.5.5 0 0 1-.708.708L8 8.707l-5.146 5.147a.5.5 0 0 1-.708-.708L7.293 8z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <main class="container-fluid p-3 p-md-4">
        <div id="product-grid" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 row-cols-xl-5 g-4">
            <!-- Los productos se cargarán aquí -->
        </div>
    </main>

    <a href="https://wa.me/5491134317611" target="_blank" rel="noopener noreferrer" id="whatsapp-fab" title="Chatea con nosotros en WhatsApp">
        <svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M16.75 13.96c.25.13.43.2.5.25a.48.48 0 0 1 .2.37c-.03.25-.2.58-.3.72s-.27.28-.5.33a1.49 1.49 0 0 1-.64.06c-.23 0-.48-.06-.82-.24s-1.12-.64-2-1.46c-.72-.67-1.2-1.34-1.5-1.85-.3-.5-.6-1.07-.6-1.61 0-.5.23-.94.63-1.28.18-.15.38-.2.55-.2.17 0 .33.02.48.04s.28.05.38.35c.1.3.18.6.22.8a.78.78 0 0 1-.06.68c-.04.1-.1.18-.18.28s-.15.17-.2.22c-.06.05-.1.1-.12.14a.8.8 0 0 0-.03.3c.02.08.05.15.1.22s.1.13.18.2a4.3 4.3 0 0 0 .58.55c.23.2.42.34.58.46zM12 2a10 10 0 0 0-10 10 10 10 0 0 0 10 10c.04 0 .08.02.12.02h.12c.03 0 .07 0 .1 0a9.89 9.89 0 0 0 5.12-1.48l3.35 1-1-3.37a9.86 9.86 0 0 0 1.45-5.22A10 10 0 0 0 12 2z"/></svg>
    </a>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const productGrid = document.getElementById('product-grid');
        const navbarBrandContainer = document.getElementById('navbar-brand-container');
        const searchInput = document.getElementById('search-input');
        
        const categoryDropdown = document.getElementById('category-dropdown');
        const categoryDropdownMenu = document.getElementById('category-dropdown-menu');

        const brandDropdownContainer = document.getElementById('brand-dropdown-container');
        const brandDropdown = document.getElementById('brand-dropdown');
        const brandDropdownMenu = document.getElementById('brand-dropdown-menu');
        
        const measureDropdownContainer = document.getElementById('measure-dropdown-container');
        const measureDropdown = document.getElementById('measure-dropdown');
        const measureDropdownMenu = document.getElementById('measure-dropdown-menu');

        const clearFiltersBtn = document.getElementById('clear-filters-btn');
        
        let allProducts = [];

        const formatCurrency = (value) => {
          if (!value || String(value).trim() === '') return 'Consultar';
          if (/[a-zA-Z]/.test(String(value))) return value;
          const standardizedValue = String(value).replace(/\./g, '').replace(',', '.');
          const number = parseFloat(standardizedValue);
          if (isNaN(number)) return value;
          return new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS' }).format(number);
        };

        const createProductCardHTML = (product) => {
          const details = [product.medida, product.origen].filter(Boolean).join(' - ');
          
          return `
            <div class="col">
                <div class="card h-100 bg-dark text-light border-secondary shadow-sm">
                    <div class="card-img-top-container bg-white">
                        <img src="${product.imageUrl}" alt="${product.name}" class="card-img-top" />
                    </div>
                    <div class="card-body d-flex flex-column">
                        ${product.brand ? `<p class="text-muted text-uppercase small fw-semibold">${product.brand}</p>` : ''}
                        <p class="small text-warning">${product.category}</p>
                        <h5 class="card-title fw-bold mt-1">${product.name}</h5>
                        ${details ? `<p class="small text-muted mt-1">${details}</p>` : ''}
                        
                        <div class="mt-auto pt-3">
                          ${product.cashPrice ? `
                              <div>
                                  <p class="text-muted text-decoration-line-through mb-0">${formatCurrency(product.listPrice)}</p>
                                  <p class="h3 fw-bolder text-warning">${formatCurrency(product.cashPrice)}</p>
                                  <p class="small text-muted">Precio Contado</p>
                              </div>
                          ` : `
                              <div>
                                  <p class="h3 fw-bolder text-warning">${formatCurrency(product.listPrice)}</p>
                                  <p class="small text-muted">Precio de Lista</p>
                              </div>
                          `}
                        </div>
                        
                        <div class="mt-3 flex-grow-1 d-flex align-items-center" style="min-height: 80px;">
                            ${product.description ? `<p class="card-text small text-justify">${product.description}</p>` : ''}
                        </div>
                    </div>
                     <div class="card-footer bg-black text-white-50 small text-center">
                        <p class="mb-1 fw-semibold">Lagartobike - Av. Juan de Garay 612 - San Telmo - CABA</p>
                        <div class="d-flex align-items-center justify-content-center flex-wrap gap-3 mt-2">
                            <div class="d-flex align-items-center gap-1">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-instagram" viewBox="0 0 16 16"><path d="M8 0C5.829 0 5.556.01 4.703.048 3.85.088 3.269.222 2.76.42a3.9 3.9 0 0 0-1.417.923A3.9 3.9 0 0 0 .42 2.76C.222 3.268.087 3.85.048 4.703 0 5.556 0 5.829 0 8s.01 2.444.048 3.297c.04.852.174 1.433.372 1.942.205.526.478.972.923 1.417.444.445.89.719 1.416.923.51.198 1.09.333 1.942.372C5.556 23.99 5.829 24 8 24s2.444-.01 3.297-.048c.852-.04 1.433-.174 1.942-.372.526-.205.972-.478 1.417-.923.445-.444.718-.891.923-1.417.198-.51.333-1.09.372-1.942C23.99 18.444 24 18.171 24 16s-.01-2.444-.048-3.297c-.04-.852-.174-1.433-.372-1.942a3.9 3.9 0 0 0-.923-1.417A3.9 3.9 0 0 0 18.24.42c-.51-.198-1.09-.333-1.942-.372C15.444.01 15.171 0 12 0H8zm0 2.88c2.136 0 2.389.007 3.232.046.78.035 1.204.166 1.486.275.373.145.64.319.92.599.28.28.453.546.598.92.11.282.24.705.275 1.486.039.843.047 1.096.047 3.232s-.008 2.389-.047 3.232c-.035.78-.166 1.204-.275 1.486a2.5 2.5 0 0 1-.598.92c-.28.28-.546.453-.92.598-.282.11-.705.24-1.486.275-.843.039-1.096.047-3.232.047s-2.389-.008-3.232-.047c-.78-.035-1.204-.166-1.486-.275a2.5 2.5 0 0 1-.92-.598c-.28-.28-.453-.546-.598-.92-.11-.282-.24-.705-.275-1.486-.039-.843-.047-1.096-.047-3.232s.008-2.389.047-3.232c.035-.78.166-1.204.275-1.486.145-.373.319-.64.599-.92.28-.28.546-.453.92-.598.282-.11.705.24 1.486.275.843-.039 1.096-.047 3.232-.047zM8 12c0-2.21 1.79-4 4-4s4 1.79 4 4-1.79 4-4 4-4-1.79-4-4zm6.406-4.883a1.144 1.144 0 1 0 0-2.288 1.144 1.144 0 0 0 0 2.288z"/></svg>
                                <span class="small">lagarto.bike</span>
                            </div>
                            <div class="d-flex align-items-center gap-1">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-facebook" viewBox="0 0 16 16"><path d="M16 8.049c0-4.446-3.582-8.05-8-8.05C3.58 0 0 3.603 0 8.049c0 4.017 2.926 7.347 6.75 7.951v-5.625h-2.03V8.05H6.75V6.275c0-2.017 1.195-3.131 3.022-3.131.876 0 1.791.157 1.791.157v1.98h-1.009c-.993 0-1.303.621-1.303 1.258v1.51h2.218l-.354 2.326H9.25V16c3.824-.604 6.75-3.934 6.75-7.951z"/></svg>
                                <span class="small">Lagartobike</span>
                            </div>
                            <div class="d-flex align-items-center gap-1">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-telephone" viewBox="0 0 16 16"><path d="M3.654 1.328a.678.678 0 0 0-1.015-.063L1.605 2.3c-.483.484-.661 1.169-.45 1.77a17.6 17.6 0 0 0 4.168 6.608 17.6 17.6 0 0 0 6.608 4.168c.601.211 1.286.033 1.77-.45l1.034-1.034a.678.678 0 0 0-.063-1.015l-2.307-1.794a.68.68 0 0 0-.58-.122l-2.19.547a1.75 1.75 0 0 1-1.657-.459L5.482 8.062a1.75 1.75 0 0 1-.46-1.657l.548-2.19a.68.68 0 0 0-.122-.58zM1.884.511a1.745 1.745 0 0 1 2.612.163L6.29 2.98c.329.423.445.974.315 1.494l-.547 2.19a.68.68 0 0 0 .178.643l2.457 2.457a.68.68 0 0 0 .644.178l2.189-.547a1.75 1.75 0 0 1 1.494.315l2.306 1.794c.829.645.905 1.87.163 2.612l-1.034 1.034c-.74.74-1.846 1.065-2.877.702a18.6 18.6 0 0 1-7.01-4.42 18.6 18.6 0 0 1-4.42-7.009c-.363-1.03-.038-2.137.703-2.877z"/></svg>
                                <span class="small">Sebastian 11-3431-7611</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
          `;
        };

        const updateDropdown = (container, dropdown, dropdownMenu, items, label) => {
          if (items.length <= 1) {
            container.style.display = 'none';
            return;
          }
          container.style.display = 'block';
          dropdownMenu.innerHTML = '';
          const allItem = document.createElement('li');
          allItem.innerHTML = `<a class="dropdown-item" href="#" data-value="all">Todos los ${label}</a>`;
          dropdownMenu.appendChild(allItem);

          items.forEach(item => {
            if (item === 'all') return;
            const li = document.createElement('li');
            li.innerHTML = `<a class="dropdown-item" href="#" data-value="${item}">${item}</a>`;
            dropdownMenu.appendChild(li);
          });
        };

        const renderCatalog = (data) => {
            // Logo
            if (data.logoUrl && navbarBrandContainer) {
              const logoImg = document.createElement('img');
              logoImg.src = data.logoUrl;
              logoImg.alt = 'Logo';
              logoImg.className = 'navbar-logo';
              navbarBrandContainer.prepend(logoImg);
            }
            
            // Products
            allProducts = data.products;
            applyFilters();
        };

        const applyFilters = () => {
          const searchTerm = searchInput.value.toLowerCase();
          const selectedCategory = categoryDropdown.getAttribute('data-value');
          const selectedBrand = brandDropdown.getAttribute('data-value');
          const selectedMeasure = measureDropdown.getAttribute('data-value');

          const isFilterActive = searchTerm || selectedCategory !== 'all' || selectedBrand !== 'all' || selectedMeasure !== 'all';
          clearFiltersBtn.style.display = isFilterActive ? 'block' : 'none';

          // --- Cascading Filter Logic ---
          
          const productsFilteredBySearchAndCategory = allProducts.filter(product => {
              const matchesCategory = selectedCategory === 'all' || product.category === selectedCategory;
              const matchesSearch = product.name.toLowerCase().includes(searchTerm);
              return matchesCategory && matchesSearch;
          });
          
          const availableBrands = ['all', ...Array.from(new Set(productsFilteredBySearchAndCategory.map(p => p.brand).filter(Boolean)))];
          updateDropdown(brandDropdownContainer, brandDropdown, brandDropdownMenu, availableBrands, 'Marcas');
          
          const currentSelectedBrand = brandDropdown.getAttribute('data-value');
          if (!availableBrands.includes(currentSelectedBrand)) {
              brandDropdown.setAttribute('data-value', 'all');
              brandDropdown.textContent = 'Marcas';
          }

          const productsFilteredByBrand = productsFilteredBySearchAndCategory.filter(product => {
              const currentBrand = brandDropdown.getAttribute('data-value');
              const matchesBrand = currentBrand === 'all' || product.brand === currentBrand;
              return matchesBrand;
          });

          const availableMeasures = ['all', ...Array.from(new Set(productsFilteredByBrand.map(p => p.medida).filter(Boolean)))];
          updateDropdown(measureDropdownContainer, measureDropdown, measureDropdownMenu, availableMeasures, 'Medidas');
          
          const currentSelectedMeasure = measureDropdown.getAttribute('data-value');
          if (!availableMeasures.includes(currentSelectedMeasure)) {
            measureDropdown.setAttribute('data-value', 'all');
            measureDropdown.textContent = 'Medida';
          }
          
          const finalProducts = productsFilteredByBrand.filter(product => {
            const currentMeasure = measureDropdown.getAttribute('data-value');
            const matchesMeasure = currentMeasure === 'all' || product.medida === currentMeasure;
            return matchesMeasure;
          });

          // --- End of Cascading Filter Logic ---

          // Populate main filters if they are empty
          if(categoryDropdownMenu.children.length === 0) {
            const allCategories = ['all', ...Array.from(new Set(allProducts.map(p => p.category).filter(Boolean)))];
            updateDropdown(document.querySelector('.nav-item.dropdown'), categoryDropdown, categoryDropdownMenu, allCategories, 'Familias');
          }

          finalProducts.sort((a, b) => {
            const categoryComparison = a.category.localeCompare(b.category, 'es', { sensitivity: 'base' });
            if (categoryComparison !== 0) return categoryComparison;
            const brandA = a.brand || '';
            const brandB = b.brand || '';
            const brandComparison = brandA.localeCompare(brandB, 'es', { sensitivity: 'base' });
            if (brandComparison !== 0) return brandComparison;
            const measureA = a.medida || '';
            const measureB = b.medida || '';
            return measureA.localeCompare(measureB, 'es', { sensitivity: 'base' });
          });
          
          productGrid.innerHTML = finalProducts.length 
            ? finalProducts.map(createProductCardHTML).join('')
            : '<p class="text-center col-12 text-muted">No se encontraron productos con los filtros aplicados.</p>';
        };
        
        searchInput.addEventListener('input', applyFilters);
        clearFiltersBtn.addEventListener('click', () => {
            searchInput.value = '';
            categoryDropdown.setAttribute('data-value', 'all');
            categoryDropdown.textContent = 'Familia';
            brandDropdown.setAttribute('data-value', 'all');
            brandDropdown.textContent = 'Marcas';
            measureDropdown.setAttribute('data-value', 'all');
            measureDropdown.textContent = 'Medida';
            applyFilters();
        });

        document.querySelectorAll('.dropdown-menu').forEach(menu => {
            menu.addEventListener('click', (e) => {
                const target = e.target;
                if (target.matches('.dropdown-item')) {
                    e.preventDefault();
                    const value = target.getAttribute('data-value');
                    const dropdownToggle = target.closest('.dropdown').querySelector('.dropdown-toggle');
                    dropdownToggle.setAttribute('data-value', value);
                    if (value === 'all') {
                        dropdownToggle.textContent = dropdownToggle.id.includes('category') ? 'Familia' : (dropdownToggle.id.includes('brand') ? 'Marcas' : 'Medida');
                    } else {
                        dropdownToggle.textContent = target.textContent;
                    }
                    applyFilters();
                }
            });
        });

        
        fetch('data.json')
            .then(response => response.json())
            .then(data => renderCatalog(data))
            .catch(error => {
                console.error('Error al cargar los datos de los productos:', error);
                document.getElementById('product-grid').innerHTML = '<p class="text-center col-12 text-danger">No se pudo cargar el catálogo.</p>';
            });
      
      });
    </script>
</body>
</html>
